[sync_lock]
; WORLD + A3 64-bit / Whisky+Wine. Spice: -k dll_mods\sync_lock\sync_lock_64bit.dll
; Logging on for macOS diagnostics. SOUND OFFSET still sets constant latency.
; Build is auto-detected (WORLD vs A3) from known RVAs when prologues match.
log=1
enabled=1
; auto|qpc|wasapi|xact  (wasapi/xact fall back to qpc under Wine)
source=auto
; Extra ms subtracted from the locked clock (fine-tune on top of SOUND OFFSET)
latency_ms=0
; Units per second for the gamemdx clock (SOUND_OFFSET is ms => 1000)
tick_rate=1000
; Periodic game_vs_ours log while in chart (0=off)
log_interval_ms=2000
time_period_1=1
; Defaults = WORLD 2025080500. On A3, auto-detect switches to the A3 set
; below if these prologues do not match. You may also set A3 RVAs explicitly.
; WORLD: clock 0x22D40  dp 0x549D0  mdp 0x5E780  scene 0x488A30  system 0x6B5A80
; A3:    clock 0x1B670  dp 0x39650  mdp 0x40B60  scene 0x2E8550  system 0x2EEE30
rva_clock_update=0x22D40
rva_dp_update=0x549D0
rva_mdp_update=0x5E780
rva_scene=0x488A30
rva_system=0x6B5A80
off_clock=0x1268
verify_prologue=1
