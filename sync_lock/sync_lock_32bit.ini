[sync_lock]
; A3 2024040200 32-bit. Spice: -k dll_mods\sync_lock\sync_lock_32bit.dll
; Logging on for diagnostics. SOUND OFFSET still sets constant latency.
log=1
enabled=1
; auto|qpc|wasapi|xact  (wasapi/xact fall back to qpc under Wine)
source=auto
; Extra ms subtracted from the locked clock (fine-tune on top of SOUND OFFSET)
latency_ms=0
; Units per second for the gamemdx clock (SOUND_OFFSET is ms => 1000)
tick_rate=1000
; Periodic game_vs_ours log while in chart (0=off)
log_interval_ms=2000
time_period_1=1
; A3 2024040200 x86 defaults
; clock 0x172E0  dp 0x30670  mdp 0x369F0  scene 0x2549D0  system 0x25A964
rva_clock_update=0x172E0
rva_dp_update=0x30670
rva_mdp_update=0x369F0
rva_scene=0x2549D0
rva_system=0x25A964
off_clock=0x1268
verify_prologue=1
