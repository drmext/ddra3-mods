[mmod_speed]
log=0
enabled=1
; Target scroll BPM per side (World Real Speed / M-Mod). Clamp 10-2000.
m_bpm_1p=600
m_bpm_2p=600
; In-song Menu Left/Right nudge step (BPM). Not persisted after the song.
m_bpm_step=10
; 0 = stock visibility. 1 = force WORLD-style CONSTANT display-time gate.
; Notes still scroll via M-Mod; only draw timing changes (100-3000 ms, step 10).
constant=1
constant_ms_1p=600
constant_ms_2p=600
; Menu Left/Right nudge step for display time (when editing constant_ms).
; With constant=1: default Menu L/R nudges m_bpm; tap Menu Left+Right together
; to toggle editing constant_ms (ONLINE shows C####*; chord again to return).
constant_ms_step=10
; 1 = replace ONLINE with live BPM / mmod readout. 0 = stock ONLINE.
online_hud=1
; gamemdx.dll RVAs from imagebase 0x180000000 (A3 2024040200 64-bit).
; Option flatten/copy (writes hispeed index at dest+0x0C via GetHispeed).
rva_option_copy=0x125DC0
; GamePlayActor setup (sub_18003B490): bakes scroll floats at +0x268/+0x26C.
rva_gameplay_setup=0x3B490
; GamePlayActor onUpdate (vftable +0x30): in-song Menu Left/Right poll.
rva_gameplay_update=0x3C2F0
; OptionIconActor: speed_x%03d graphic (full rebuild + live 4165 handler).
; Legacy rva_csa_refresh= is still accepted as an alias for refresh.
rva_option_icon_refresh=0x2B630
rva_option_icon_live=0x2D500
rva_option_icon_vftable=0x2674B8
; ControlSpeedActor vftable (early Menu L/R; Option embed at +0x90).
rva_csa_vftable=0x268AA8
; lea rdx,[rip+disp] that loads stock " ONLINE" - retargeted to our buffer.
rva_online_lea=0x8F9F
; ONLINE UI text wrapper (for PASELI-white redraw of mmod label).
rva_ui_text_online=0x2EEDF8
; Status HUD draw - refreshes ONLINE buffer so it restores after the song.
rva_status_hud=0x8A00
; Arcade IO function-pointer slots (arkMDXGet*).
rva_get_menu_left=0x2EE458
rva_get_menu_right=0x2EE460
rva_get_start=0x2EE478
rva_io_state=0x2EEE30
; SSQ analyzer (sub_180029F70) + note parse (sub_18011C220).
; Core BPM is computed after parse when caller is the analyzer.
rva_ssq_analyze=0x29F70
rva_note_parse=0x11C220
rva_analyze_parse_ret=0x2A1AF
; GamePlayActor note_parse return (selected song mcode is valid here).
rva_gameplay_parse_ret=0x3AA4A
; Music-select radar note_parse return - never cache under game mcode.
rva_radar_parse_ret=0xE643C
; music lookup by mcode -> music::Info (bpmmax at +0x90).
rva_music_lookup=0x106100
rva_players=0x2EF000
rva_game=0x2ED6D0
; Option vftable (SetHispeed +0x18, GetHispeed +0x20). Tiny getters need
; vtable patch; MinHook alone cannot trampoline 4-byte stubs.
rva_option_vftable=0x280538
; GamePlayActor vftable - used to reject stale g_gameplay[] pointers.
rva_gameplay_vftable=0x268F08
; music::Info field offsets (uint16). Packed mdb uses +0x18C/+0x18E.
off_bpmmax=0x90
off_bpmmin=0x92
; Player object: Option +0xD0, mcode +0x54, style +0x58, difficulty +0x5C.
; World chart index = difficulty + 5 * (style != 0).
off_player_option=0xD0
off_player_music=0x54
off_player_style=0x58
off_player_diff=0x5C
; A3 note record (76 bytes). type+0, tick+4, ms+8. BPM derived from 0x80 pairs.
note_stride=76
off_note_type=0
off_note_time=4
off_note_ms=8
; 1 = wait until option_copy + ssq_analyze prologues match before hooks.
verify_prologue=1
