[retry_exit]
log=0
enabled=1
; Instant Quick Fail while START is held.
; After the chart ends: still holding START = retry;
; START + Menu Left both held (at any point during the fail) = select;
; released = stock Result. Arcade IO: arkMDXGetStart / arkMDXGetLeft (Menu Left).
; Miss-fail (4157 during chart life ticks): keep playing until actor inner >= 5.
; After miss-fail, hold START from song_end for Quick Fail / retry / select.
; log=1 appends forever — leave 0 on cabinets.
; menu_window_ms is unused (legacy); path uses buttons currently held.
;menu_window_ms=500
; A3 2024040200 32-bit RVAs from imagebase 0x10000000.
rva_create_next=0x21A20
rva_song_end=0x320A0
rva_get_start=0x25A47C
rva_get_menu_left=0x25A46C
rva_io_state=0x25A964
rva_dp_update=0x30670
rva_mdp_update=0x369F0
; Quick Fail: zero life AFTER add [gauge+0x70], BEFORE the <=0 check.
rva_life_add=0x445ED
rva_send_event=0x1390D0
dp_play_case=7
mdp_play_case=11
; A3 sequence IDs (same as 64-bit):
;  29 / 50 = DancePlay retry (solo / matching)
;  27 / 47 = SelectMusic (stock after TS 32)
;  30 = post-song unload
;  31 / 51 = Result
;  32 = follow-up after an injected TS 30
ts_after_song=30
ts_retry=29
ts_retry_matching=50
ts_result=31
ts_result_matching=51
ts_after_unload=32
ts_select=27
verify_prologue=1
