[arrow_colors]
log=0
enabled=1
; expand_note_colors: NOTE type only. Extra quants get unique atlas rows 16-20;
; 4th/8th/16th use the tables below; 192nd stays stock green.
expand_note_colors=1
; solidify_mode (independent of expand, all color types):
;  0 = off
;  1 = FILL          fill stays fully visible, border still animates
;  2 = FILL+BORDER   also lock the border to one cycle phase
;  3 = COMPLETE      also use the border color for the fill (fully solid NOTE arrow)
solidify_mode=2
; Packed AARRGGBB dwords (same as WORLD gamemdx tables at unpacked 0x2DA300 / 0x2DA320).
; 0xFFF88080 = RGB(248,128,128). 0 = use the built-in default for that slot.
border_4th=0xFFF88080
border_8th=0xFF8080F8
border_12th=0xFFCC82F7
border_16th=0xFFF8F880
border_24th=0xFFF880BE
border_32nd=0xFFF8B981
border_48th=0xFFF8C4DE
border_64th=0xFF80F8F8
fill_4th=0xFFF80000
fill_8th=0xFF0000F8
fill_12th=0xFFCC00F8
fill_16th=0xFFF8F800
fill_24th=0xFFF80080
fill_32nd=0xFFF88000
fill_48th=0xFFF8A0C0
fill_64th=0xFF00F8F8
; A3 2024040200 64-bit RVAs from imagebase 0x180000000.
rva_classify=0x205A4
rva_classify_cont=0x205FC
rva_baker=0x1E7A4
rva_freeze_extra=0x20743
rva_freeze_uv=0x2086A
rva_freeze_patch=0x208F4
rva_tap_pack=0x206C6
rva_body_pack=0x1E907
rva_common_pack=0x1EFA6
rva_solidify_border=0x24841
rva_plus20=0x2484B
rva_plus18=0x24854
rva_solidify_fill=0x24897
rva_other_border=0x241E0
rva_other_fill=0x241F0
; 16->21 atlas widen (verified + undoable on failed setup).
rva_ctor_rows=0x1E2E1
rva_ctor_r9=0x1E2E9
rva_ctor_r8=0x1E2ED
rva_baker_rows=0x1E7D4
verify_prologue=1
