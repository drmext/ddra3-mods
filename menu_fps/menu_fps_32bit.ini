[menu_fps]
log=0
enabled=1
; Target rate for capped scenes. Uncapped scenes keep the high present rate.
menu_fps=60
; Scene IDs capped to menu_fps (comma-separated), or -1 = ALL scenes
; (play / Result / attract included — intentional global throttle).
; 10 = A3 SelectMusic.
cap_scenes=10
; gamemdx.dll RVAs from imagebase 0x10000000. Hex (0x...) or decimal.
; 0x109100 = A3 2024040200 rva_tick
; 0x2549D0 = A3 2024040200 rva_scene
rva_tick=0x109100
rva_scene=0x2549D0
; 1 = wait until tick starts with 55 8B EC 83 EC 08
; (push ebp; mov ebp, esp; sub esp, 8). Set 0 if a newer build uses a
; different prologue at rva_tick.
verify_tick_prologue=1
