[menu_fps]
log=0
enabled=1
; Target rate for capped scenes. Uncapped scenes keep the high present rate.
menu_fps=60
; Scene IDs capped to menu_fps (comma-separated), or -1 = ALL scenes
; (play / Result / attract included — intentional global throttle).
; 10 = A3 SelectMusic.
; 11 = WORLD SelectMusic.
cap_scenes=10
; gamemdx.dll RVAs from imagebase 0x180000000. Hex (0x...) or decimal.
; 0x1550F0 = A3 2024040200 rva_tick
; 0x2E8550 = A3 2024040200 rva_scene
; 0x1F8830 = WORLD 2025080500 rva_tick
; 0x488A30 = WORLD 2025080500 rva_scene
rva_tick=0x1550F0
rva_scene=0x2E8550
; 1 = wait until tick starts with 48 83 EC 28 (sub rsp, 28h). Set 0 if a
; newer build uses a different prologue at rva_tick.
verify_tick_prologue=1
