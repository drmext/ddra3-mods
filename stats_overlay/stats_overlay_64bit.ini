[stats_overlay]
log=1
enabled=1
multiline=1
show_columns=1
show_sigma=1
show_fast_slow=1
; Rolling abs mean of the last 32 timed taps.
show_window=1
font_size=14
; Pixels from the screen edge. 1P is pinned to the bottom-right corner
; (lines grow left/up). 2P is pinned to the bottom-left (lines grow right/up).
; The block is never moved to the other side to fit.
margin_px=8
; Translucent black panel behind the text (0=invisible, 255=opaque).
box_alpha=176
; Overlay is shown only on these scene IDs while the play sequence is
; actually ticking in-chart. Any other scene (select, result, test menu)
; hides and resets immediately.
; WORLD: 4 (DancePlay), 12 (MatchingDancePlay / BPL)
; A3:    4 (DancePlay), 11 (MatchingDancePlay)
; The 64-bit DLL auto-detects WORLD vs A3 from the judge prologue and
; switches A3 play_scenes from 4,12 to 4,11 when these WORLD defaults
; are still in the ini.
play_scenes=4,12
; gamemdx.dll RVAs from imagebase 0x180000000. Hex (0x...) or decimal.
; WORLD 2025080500 - used until A3 2024040200 is
; detected, then the DLL switches to:
;   rva_judge=0x3EFD0 rva_dp_update=0x39650 rva_mdp_update=0x40B60
;   rva_scene=0x2E8550
rva_judge=0x5C780
rva_dp_update=0x549D0
rva_mdp_update=0x5E780
rva_scene=0x488A30
; 1 = wait until each hook target matches its known prologue.
verify_prologue=1
