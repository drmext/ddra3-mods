[stats_overlay]
log=1
enabled=1
multiline=1
show_columns=1
show_sigma=1
show_fast_slow=1
; Rolling abs mean of the last 32 timed taps.
show_window=1
font_size=14
; Pixels from the screen edge. 1P is pinned to the bottom-right corner
; (lines grow left/up). 2P is pinned to the bottom-left (lines grow right/up).
; The block is never moved to the other side to fit.
margin_px=8
; Translucent black panel behind the text (0=invisible, 255=opaque).
box_alpha=176
; Overlay is shown only on these A3 scene IDs (DancePlay, MatchingDancePlay)
; while the play sequence is actually ticking in-chart. Any other scene
; (select, result, test menu) hides and resets immediately.
play_scenes=4,11
; gamemdx.dll RVAs from imagebase 0x10000000. Hex (0x...) or decimal.
; A3 2024040200 32-bit.
rva_judge=0x353A0
rva_dp_update=0x30670
rva_mdp_update=0x369F0
rva_scene=0x2549D0
; 1 = wait until each hook target matches its known prologue.
verify_prologue=1
